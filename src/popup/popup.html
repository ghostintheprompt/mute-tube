<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="boombox">
        <div class="boombox-header">
            <div class="brand">MUTETUBE</div>
            <div class="model">AD-KILLER 80</div>
        </div>
        
        <div class="display-panel">
            <div class="led-display">
                <span id="status">READY</span>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="big-buttons">
                <button id="toggle-btn" class="control-btn play" title="Enable or disable Mute Tube">▶</button>
                <button id="skip-btn" class="control-btn" title="Skip visible ad">⏭</button>
            </div>
            
            <div class="small-buttons">
                <button id="mute-btn" class="mini-btn" title="Toggle mute">🔇</button>
                <button id="settings-btn" class="mini-btn" title="Security settings">⚙</button>
            </div>
        </div>

        <div id="settings-panel" class="settings-panel" hidden>
            <div class="settings-title">SECURITY DECK</div>
            <div class="settings-row">
                <span>STATE</span>
                <strong id="enabled-state">ON</strong>
            </div>
            <div class="settings-row">
                <span>NETWORK</span>
                <strong>BLOCKED</strong>
            </div>
            <div class="settings-row">
                <span>AUDIT LOG</span>
                <strong id="audit-count">0</strong>
            </div>
            <button id="clear-log-btn" class="wide-btn">CLEAR AUDIT LOG</button>
        </div>
        
        <div class="speaker-grilles">
            <div class="speaker left-speaker"></div>
            <div class="speaker right-speaker"></div>
        </div>
        
        <div class="status-lights">
            <div class="led power-led"></div>
            <div class="led mute-led"></div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
